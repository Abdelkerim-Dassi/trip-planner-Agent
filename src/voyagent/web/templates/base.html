<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ReelTrip · The reality check for trip plans{% endblock %}</title>
  <meta name="description" content="{% block description %}Paste any trip itinerary, from ChatGPT or anywhere else. ReelTrip looks up each place on the map and flags closed days, wrong cities and days that don't fit. Free, no account.{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ReelTrip">
  {% block social_meta %}
  <meta property="og:url" content="{{ public_url }}/">
  <meta property="og:image" content="{{ public_url }}/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ public_url }}/og.png">
  <link rel="canonical" href="{{ public_url }}/">
  {% endblock %}
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <main class="wrap">
    {% block content %}{% endblock %}
    <footer class="foot">
      ReelTrip · free and open source ·
      places looked up on <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
      <a href="/privacy">Privacy</a> ·
      <a href="{{ contact_url }}" target="_blank" rel="noopener">Report a problem</a>
      {% if support_url %} · <a href="{{ support_url }}" target="_blank" rel="noopener">Support ReelTrip ☕</a>{% endif %}
    </footer>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
